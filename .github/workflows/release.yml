name: release
on:
  push:
    branches:
      - 'main'
      - 'beta'
      - 'alpha'
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: '18.x'
      - name: Install deps
        # this runs a build script so there is no dedicated build
        run: yarn install
      - name: Run storybook build script
        run: NODE_OPTIONS=--openssl-legacy-provider yarn build-storybook
  release:
    needs: main
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'saboit/thomas' && contains('refs/heads/main,refs/heads/beta,refs/heads/alpha',github.ref) && github.event_name == 'push' }}
    permissions:
      contents: write # to push the release commit and tag, and create a GitHub release
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
      id-token: write # for npm trusted publishing (OIDC)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Install deps
        # this runs a build script so there is no dedicated build
        run: yarn install
      - name: 🚀 Release
        run: npx -p semantic-release@25 -p @semantic-release/git@10 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
